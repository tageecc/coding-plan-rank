name: Test Markdown data pipeline

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run render -- --check
