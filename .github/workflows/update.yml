name: Daily official plan update

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update.yml'

permissions: {}

concurrency:
  group: daily-plan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Update official plans
        id: update
        run: npm run update
      - name: Refresh votes and provision missing provider issues
        id: votes
        continue-on-error: true
        run: npm run votes -- --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Render Markdown
        run: npm run render
      - name: Validate parsers and generated Markdown
        id: validate
        run: |
          npm test
          npm run render -- --check
      - name: Commit generated data and Markdown
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ README.md README.en.md docs/providers/
          if [ -f docs/changes.md ]; then git add docs/changes.md; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official plans and community votes'
            git push origin HEAD:main
          fi
      - name: Report verification failures
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          VOTES_OUTCOME: ${{ steps.votes.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          PIPELINE_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const label = 'data-update';
            const marker = '<!-- coding-plan-rank:data-update -->';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Data is parsed at runtime, never interpolated into JavaScript source.
            let report;
            try { report = JSON.parse(await fs.readFile('data/update-status.json', 'utf8')); }
            catch { report = { providers: [] }; }
            const failed = report.providers.filter(provider => provider.status !== 'ok');
            const needsAttention = failed.length || process.env.VOTES_OUTCOME !== 'success' || process.env.UPDATE_OUTCOME !== 'success' || process.env.PIPELINE_STATUS !== 'success';
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: label, per_page: 100 });
            const existing = issues.find(issue => !issue.pull_request && issue.user?.login === 'github-actions[bot]' && issue.body?.includes(marker));
            if (!needsAttention) {
              if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
            catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd97706', description: 'Official data verification or daily pipeline needs review' });
            }
            const title = '[data] Daily plan verification needs review';
            const summary = failed.length
              ? failed.map(provider => `- ${provider.id}: ${provider.status}; last verified ${provider.checkedAt || 'never'}`).join('\n')
              : '- A pipeline step failed. Inspect the run logs.';
            const body = `${marker}\nOfficial data needs review. Last successful values are retained; failed providers do not receive a new checkedAt.\n\n${summary}\n\nVote refresh: ${process.env.VOTES_OUTCOME}. Data refresh: ${process.env.UPDATE_OUTCOME}. Pipeline: ${process.env.PIPELINE_STATUS}.\n\n[Workflow run](${runUrl})\n\nFull diagnostics: data/update-status.json. Quota decreases and unsupported plan changes require parser or baseline review.`;
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
      - name: Fail run after publishing visible status
        if: ${{ always() }}
        env:
          VOTES_OUTCOME: ${{ steps.votes.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('data/update-status.json', 'utf8'));
          if (report.providers.some(provider => provider.status !== 'ok') || process.env.VOTES_OUTCOME !== 'success' || process.env.UPDATE_OUTCOME !== 'success') {
            console.error('Verification or vote refresh requires attention; published status retains last successful values.');
            process.exitCode = 1;
          }
          JS
